[project]
name = "sceneseek"
version = "0.1.0"
description = "Natural language scene retrieval over movie stills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "insightface>=1.0.1",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.1",
    "typer>=0.27.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
sceneseek = "sceneseek.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sceneseek"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
